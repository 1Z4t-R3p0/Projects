{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Report Public Issue</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title_select">Issue Category</label>
            <select name="title_select" id="title_select" class="form-control" required onchange="toggleManualTitle()">
                <option value="Garbage Overflow">Garbage Overflow</option>
                <option value="Potholes">Potholes</option>
                <option value="Water Leakage">Water Leakage</option>
                <option value="Streetlight Problem">Streetlight Problem</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group" id="manual_title_group" style="display: none;">
            <label for="manual_title">Manual Issue Title</label>
            <input type="text" name="manual_title" id="manual_title" class="form-control"
                placeholder="Enter custom title">
        </div>
        <div class="form-group">
            <label for="location">Location (Address/Landmark)</label>
            <input type="text" name="location" class="form-control" required
                placeholder="e.g. Main Street, near Post Office">
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
            <div style="flex: 1;">
                <label for="latitude">Latitude (Optional)</label>
                <input type="text" name="latitude" class="form-control" placeholder="e.g. 11.0168">
            </div>
            <div style="flex: 1;">
                <label for="longitude">Longitude (Optional)</label>
                <input type="text" name="longitude" class="form-control" placeholder="e.g. 76.9558">
            </div>
        </div>
        <div class="form-group">
            <label for="maps_link">Google Maps Link (Optional)</label>
            <input type="url" name="maps_link" class="form-control" placeholder="https://maps.app.goo.gl/...">
        </div>
        <div class="form-group">
            <label for="image">Upload Image</label>
            <input type="file" name="image" class="form-control" accept="image/*" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea name="description" class="form-control" rows="4" required
                placeholder="Describe the issue in detail..."></textarea>
        </div>
        <button type="submit" class="btn">Submit Report</button>
    </form>
</div>

<script>
    function toggleManualTitle() {
        const select = document.getElementById('title_select');
        const manualGroup = document.getElementById('manual_title_group');
        const manualInput = document.getElementById('manual_title');

        if (select.value === 'Other') {
            manualGroup.style.display = 'block';
            manualInput.setAttribute('required', 'required');
        } else {
            manualGroup.style.display = 'none';
            manualInput.removeAttribute('required');
        }
    }
</script>

{% endblock %}
